<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Memory Bank</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.5 system-ui, sans-serif; padding: 12px; }
  header { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  header h1 { font-size: 14px; margin: 0 auto 0 0; }
  input[type=search], select, textarea, .f input {
    padding: 6px 8px; border: 1px solid #8884; border-radius: 6px;
    background: transparent; color: inherit; font: inherit;
  }
  input[type=search] { flex: 1; min-width: 120px; }
  select { cursor: pointer; }
  button { padding: 5px 9px; border: 1px solid #8884; border-radius: 6px; background: transparent; color: inherit; cursor: pointer; }
  button:hover { background: #8882; }
  button.primary { border-color: transparent; background: #4a7dff; color: #fff; }
  button.danger:hover { background: #c0392b33; border-color: #c0392b; }
  .card { border: 1px solid #8884; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
  .card .head { display: flex; align-items: center; gap: 6px; cursor: pointer; flex-wrap: wrap; }
  .card .name { font-weight: 600; word-break: break-all; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid #8884; color: #888; }
  .badge.t-user { color: #2e86de; border-color: #2e86de66; }
  .badge.t-feedback { color: #e67e22; border-color: #e67e2266; }
  .badge.t-project { color: #27ae60; border-color: #27ae6066; }
  .badge.t-reference { color: #8e44ad; border-color: #8e44ad66; }
  .card .date { font-size: 11px; color: #888; margin-left: auto; }
  .card .desc { color: #888; margin-top: 2px; }
  .card pre { white-space: pre-wrap; word-break: break-word; background: #8881; border-radius: 6px; padding: 8px; margin: 8px 0 6px; }
  .card textarea, .card .f input { width: 100%; margin: 4px 0; }
  .card textarea { min-height: 90px; resize: vertical; }
  .ops { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .status { color: #888; padding: 20px; text-align: center; }
  .err { color: #c0392b; }
  #form { border: 1px dashed #8886; border-radius: 8px; padding: 10px; margin-bottom: 10px; display: none; }
  #form textarea { width: 100%; min-height: 70px; resize: vertical; margin: 6px 0; }
  #form .row { display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<header>
  <h1>🧠 Memory Bank</h1>
  <select id="scope">
    <option value="all">全部范围</option>
    <option value="global">全局</option>
    <option value="project">项目</option>
  </select>
  <input id="q" type="search" placeholder="搜索记忆…" />
  <button id="add" class="primary">＋ 新增</button>
  <button id="refresh">刷新</button>
</header>
<div id="form">
  <div class="f"><input id="f-desc" placeholder="一句话描述（用于索引和召回）" /></div>
  <textarea id="f-text" placeholder="记忆正文…"></textarea>
  <div class="row">
    <select id="f-type">
      <option value="project">project（项目事实）</option>
      <option value="user">user（用户偏好）</option>
      <option value="feedback">feedback（工作方式）</option>
      <option value="reference">reference（外部链接）</option>
    </select>
    <select id="f-scope">
      <option value="global">全局</option>
      <option value="project">项目</option>
    </select>
    <button id="f-save" class="primary">保存</button>
    <button id="f-cancel">取消</button>
  </div>
</div>
<div id="list"><div class="status">连接中…</div></div>
<script>
'use strict';
// Memory Bank 面板 v2：ext-apps 2.0 页面端最小实现。
// 握手：ui/initialize (protocolVersion 2026-01-26) → ui/notifications/initialized；
// 之后 tools/call 经宿主代理到插件 MCP server。
const PROTOCOL_VERSION = '2026-01-26';
const pending = new Map();
let nextId = 1;

function post(msg) { window.parent.postMessage(msg, '*'); }
function notify(method, params) { post({ jsonrpc: '2.0', method, params }); }
function call(method, params) {
  return new Promise((resolve, reject) => {
    const id = nextId++;
    pending.set(id, { resolve, reject });
    post({ jsonrpc: '2.0', id, method, params });
    setTimeout(() => { if (pending.has(id)) { pending.delete(id); reject(new Error(method + ' 超时')); } }, 15000);
  });
}
const tool = (name, args) => call('tools/call', { name, arguments: args })
  .then((r) => {
    if (r.isError) throw new Error((r.content || []).map((c) => c.text).join('\n'));
    return (r.content || []).map((c) => c.text).join('\n');
  });

window.addEventListener('message', (ev) => {
  if (ev.source !== window.parent) return;
  const msg = ev.data;
  if (!msg || msg.jsonrpc !== '2.0') return;
  if (msg.id !== undefined && (msg.result !== undefined || msg.error !== undefined)) {
    const p = pending.get(msg.id);
    if (p) { pending.delete(msg.id); msg.error ? p.reject(new Error(msg.error.message)) : p.resolve(msg.result); }
    return;
  }
  if (msg.method !== undefined) {
    post({ jsonrpc: '2.0', id: msg.id, error: { code: -32601, message: 'not implemented: ' + msg.method } });
  }
});

async function connect() {
  await call('ui/initialize', {
    appInfo: { name: 'Memory Bank', version: '0.5.0' },
    appCapabilities: {},
    protocolVersion: PROTOCOL_VERSION,
  });
  notify('ui/notifications/initialized');
}

function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

async function refresh() {
  const q = document.getElementById('q').value.trim();
  const scope = document.getElementById('scope').value;
  const list = document.getElementById('list');
  list.innerHTML = '<div class="status">加载中…</div>';
  try {
    const items = JSON.parse(await tool('memory_list', { query: q, scope }));
    if (!items.length) { list.innerHTML = '<div class="status">（暂无记忆）</div>'; return; }
    list.innerHTML = '';
    for (const it of items) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<div class="head"><span class="name">' + esc(it.name) + '</span>' +
        (it.pinned ? '<span title="已 pin，每会话必注入">📌</span>' : '') +
        '<span class="badge t-' + esc(it.type || 'project') + '">' + esc(it.type || '?') + '</span>' +
        '<span class="badge">' + esc(it.scope) + '</span>' +
        (it.created ? '<span class="date">' + esc(it.created) + '</span>' : '') + '</div>' +
        '<div class="desc">' + esc(it.description) + '</div>' +
        '<pre style="display:none">' + esc(it.body) + '</pre>' +
        '<div class="edit" style="display:none">' +
        '<div class="f"><input class="e-desc" value="' + esc(it.description) + '" placeholder="描述"/></div>' +
        '<textarea class="e-text">' + esc(it.body) + '</textarea></div>' +
        '<div class="ops">' +
        '<button data-op="edit">编辑</button>' +
        '<button data-op="save" class="primary" style="display:none">保存修改</button>' +
        '<button data-op="cancel" style="display:none">取消</button>' +
        '<button data-op="pin">' + (it.pinned ? '取消 Pin' : 'Pin') + '</button>' +
        '<button data-op="forget" class="danger">删除</button></div>';
      const pre = card.querySelector('pre'), editBox = card.querySelector('.edit');
      const btn = (op) => card.querySelector('[data-op=' + op + ']');
      card.querySelector('.head').onclick = () => {
        if (editBox.style.display === 'block') return;
        pre.style.display = pre.style.display === 'none' ? 'block' : 'none';
      };
      btn('edit').onclick = () => {
        pre.style.display = 'none';
        editBox.style.display = 'block';
        for (const op of ['edit', 'pin', 'forget']) btn(op).style.display = 'none';
        btn('save').style.display = btn('cancel').style.display = '';
      };
      btn('cancel').onclick = () => { editBox.style.display = 'none'; refresh(); };
      btn('save').onclick = async () => {
        try {
          await tool('memory_edit', { name: it.name, scope: it.scope,
            text: card.querySelector('.e-text').value, description: card.querySelector('.e-desc').value });
          refresh();
        } catch (err) { alert('保存失败: ' + err.message); }
      };
      btn('pin').onclick = async () => {
        try { await tool('memory_pin', { name: it.name, on: !it.pinned, scope: it.scope }); refresh(); }
        catch (err) { alert('pin 失败: ' + err.message); }
      };
      btn('forget').onclick = async () => {
        if (!confirm('删除记忆 ' + it.name + '？（移入 trash，可回溯）')) return;
        try { await tool('memory_forget', { name: it.name, scope: it.scope }); refresh(); }
        catch (err) { alert('删除失败: ' + err.message); }
      };
      list.appendChild(card);
    }
  } catch (err) {
    list.innerHTML = '<div class="status err">加载失败: ' + esc(err.message) + '</div>';
  }
}

// 新增表单
const form = document.getElementById('form');
document.getElementById('add').onclick = () => { form.style.display = form.style.display === 'block' ? 'none' : 'block'; };
document.getElementById('f-cancel').onclick = () => { form.style.display = 'none'; };
document.getElementById('f-save').onclick = async () => {
  const text = document.getElementById('f-text').value.trim();
  if (!text) { alert('正文不能为空'); return; }
  try {
    await tool('memory_save', { text, type: document.getElementById('f-type').value,
      scope: document.getElementById('f-scope').value });
    document.getElementById('f-text').value = '';
    document.getElementById('f-desc').value = '';
    form.style.display = 'none';
    refresh();
  } catch (err) { alert('保存失败: ' + err.message); }
};

let debounce;
document.getElementById('q').addEventListener('input', () => {
  clearTimeout(debounce);
  debounce = setTimeout(refresh, 300);
});
document.getElementById('scope').onchange = refresh;
document.getElementById('refresh').onclick = refresh;

connect().then(refresh).catch((err) => {
  document.getElementById('list').innerHTML =
    '<div class="status err">握手失败: ' + esc(err.message) + '<br/>请确认插件 MCP server 已连接并重启过 ZCode。</div>';
});
</script>
</body>
</html>
