<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Memory Bank</title>
<style>/*INLINE:panel.css*/</style>
</head>
<body>
<header>
  <h1>🧠 Memory Bank <span class="ver">v0.9.1</span></h1>
  <select id="scope">
    <option value="all">全部范围</option>
    <option value="global">全局</option>
    <option value="project">项目</option>
  </select>
  <select id="sort">
    <option value="time">按时间</option>
    <option value="heat">按热度</option>
    <option value="pin">Pin 优先</option>
    <option value="name">按名称</option>
  </select>
  <input id="q" type="search" placeholder="搜索记忆…" />
  <button id="insightbtn" title="洞察：类型分布/热度/遗忘候选">📊</button>
  <button id="ovbtn" title="活文档总览（跳已取代）">🗂</button>
  <button id="trashbtn" title="回收站">🗑</button>
  <button id="add" class="primary">＋ 新增</button>
  <button id="refresh">刷新</button>
</header>
<div id="trashview" style="display:none">
  <div class="status" id="trash-status">加载回收站…</div>
  <div id="trash-list"></div>
  <hr style="border-color:#8883" />
</div>
<div id="overviewview" style="display:none">
  <div class="status" id="ov-status">生成总览…</div>
  <pre id="ov-body"></pre>
  <hr style="border-color:#8883" />
</div>
<div id="insightview" style="display:none">
  <div class="status" id="insight-status">加载洞察…</div>
  <div id="insight-body"></div>
  <hr style="border-color:#8883" />
</div>
<footer id="statsbar"><span><b id="st-total">0</b>条</span><span><b id="st-global">0</b>全局</span><span><b id="st-proj">0</b>项目</span><span><b id="st-pin">0</b>📌</span></footer>
<div id="form">
  <div class="f"><input id="f-desc" placeholder="一句话描述（用于索引和召回）" /></div>
  <textarea id="f-text" placeholder="记忆正文…"></textarea>
  <div class="row">
    <select id="f-type">
      <option value="project">project（项目事实）</option>
      <option value="user">user（用户偏好）</option>
      <option value="feedback">feedback（工作方式）</option>
      <option value="reference">reference（外部链接）</option>
    </select>
    <select id="f-scope">
      <option value="global">全局</option>
      <option value="project">项目</option>
    </select>
    <button id="f-save" class="primary">保存</button>
    <button id="f-cancel">取消</button>
  </div>
</div>
<div id="list"><div class="status">连接中…</div></div>
<div id="toast"></div>
<script>
/*INLINE:panel.js*/
</script>
</body>
</html>
